<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Entrar · DevFlix</title>
  <meta name="theme-color" content="#ff1f1f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DevFlix" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/plataforma.css" />
</head>
<body>
  <div class="tela-carregando" id="carregando"><div class="spinner"></div>Carregando...</div>

  <main class="login-page">
    <div class="login-card">
      <div class="logo" style="margin-bottom: 22px; justify-content: center"><span class="logo-main">DEVFLIX</span><span class="logo-sub">SAAS</span></div>
      <h1>Entrar na plataforma</h1>
      <p class="sub">Use o e-mail e a senha que você recebeu.</p>
      <form id="loginForm">
        <div class="field" style="margin-bottom: 14px"><label for="loginEmail">E-mail</label><input type="email" id="loginEmail" required autocomplete="email" placeholder="seuemail@exemplo.com" /></div>
        <div class="field"><label for="loginSenha">Senha</label><input type="password" id="loginSenha" required autocomplete="current-password" placeholder="••••••••" /></div>
        <div class="form-error" id="loginErro"></div>
        <button class="btn btn-red" style="width: 100%; margin-top: 8px" type="submit" id="loginBtn">Entrar</button>
      </form>
      <p style="text-align: center; margin-top: 14px"><button class="link-btn" id="esqueciSenha" type="button">Esqueci minha senha</button></p>
      <button class="btn btn-outline btn-sm hidden" data-instalar type="button" style="width: 100%; margin-top: 18px"><i class="fa-solid fa-mobile-screen"></i> Instalar o app no celular</button>
      <p style="text-align: center; margin-top: 14px"><a class="link-btn" href="index.html">Ver o site da plataforma</a></p>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
